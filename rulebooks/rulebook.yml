---
- name: OpenShift Demo

  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:

    - name: Pod Failure

      condition: event.reason == "PodDeleted"

      action:
        run_job_template:
          name: Restart-Nginx
          organization: Default
